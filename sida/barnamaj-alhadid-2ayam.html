<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>برنامج الحديد: يومين بالأسبوع | Walid Factory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#F7F5EF;--card:#FFFFFF;--line:#ECE8DE;--text:#1F2328;--muted:#6B6F76;--lime:#C6F432;--ar:Cairo,"Noto Sans Arabic",Tahoma,sans-serif;--lat:"Space Grotesk",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#16181B;--card:#202328;--line:#2C3036;--text:#F1EFE8;--muted:#A3A7AE;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ar);padding:40px 16px 48px}
main{max-width:460px;margin:0 auto}
.av{width:88px;height:88px;border-radius:50%;margin:0 auto;background:var(--lime);display:grid;place-items:center;font:900 40px var(--ar);color:#1F2328}
h1{text-align:center;font:700 21px var(--lat);margin:14px 0 2px;direction:ltr} h1 b{font-family:var(--ar);font-weight:800} h1 i{font-style:normal;color:var(--muted);margin:0 6px}
.bio{text-align:center;font:600 15px/1.7 var(--ar);color:var(--muted);margin:6px 0 24px}
ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.lk{display:grid;grid-template-columns:52px 1fr;column-gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:8px 14px 8px 8px;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.lk:hover,.lk:focus-visible{transform:translateY(-2px);border-color:var(--lime);outline:none}
.lk img{width:52px;height:52px;border-radius:12px;grid-row:span 2}
.t{font:800 16px/1.45 var(--ar);min-width:0}
.f{font:600 12px var(--ar);color:var(--muted)}
li:first-child .lk{border-color:var(--lime);box-shadow:0 0 0 2px var(--lime)}
footer{text-align:center;margin-top:26px;font:500 13px var(--lat)} footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.lk{transition:none}}
</style>
<style>
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font:700 15px var(--ar)}
.top a{color:var(--muted);text-decoration:none}
h2{font:900 22px/1.5 var(--ar);margin:0 0 6px;text-wrap:balance}
.hint{font:600 14px/1.7 var(--ar);color:var(--muted);margin:0 0 16px}
.pages{display:flex;flex-direction:column;gap:14px}
.pages img{width:100%;height:auto;border-radius:16px;border:1.5px solid var(--line);display:block}
.btn{display:block;text-align:center;background:var(--lime);color:#1F2328;font:800 17px var(--ar);padding:14px;border-radius:16px;text-decoration:none;margin:18px 0}
</style>
</head>
<body>
<main>

<img src="../bild/sidor/barnamaj-alhadid-2ayam-2.jpg" alt="برنامج الحديد: يومين بالأسبوع - صفحة 2" width="810" height="1440" loading="lazy">

</html>
